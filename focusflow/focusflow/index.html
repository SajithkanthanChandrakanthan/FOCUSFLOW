<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow - Tasks & Habits for Remote Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 26'%3E%3Cpath d='M3,15 L15,15 L21,23 L35,3' fill='none' stroke='%232563EB' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Set the theme before first paint so a dark-mode user doesn't see
    // a flash of the light palette on reload. app.js keeps it in sync after.
    try {
      var t = localStorage.getItem('focusflow.theme');
      if (!t) t = (JSON.parse(localStorage.getItem('focusflow.state.v1') || '{}')).theme; // pre-accounts save
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <!-- NavBar component mounts here -->
    <div id="navbar-root"></div>

    <main id="view-root" class="view-root">
      <!-- Active view renders here via router -->
    </main>

    <!-- Modal component mounts here -->
    <div id="modal-root"></div>

    <!-- Toast component mounts here -->
    <div id="toast-root" class="toast-root"></div>
  </div>

  <script src="js/utils/dom.js"></script>
  <script src="js/utils/dates.js"></script>
  <script src="js/utils/habitStats.js"></script>
  <script src="js/utils/taskStats.js"></script>
  <script src="js/utils/colors.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/icons.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/taskCard.js"></script>
  <script src="js/components/toggle.js"></script>
  <script src="js/components/progressRing.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/popover.js"></script>
  <script src="js/components/datePill.js"></script>
  <script src="js/components/habitModal.js"></script>
  <script src="js/components/taskModal.js"></script>
  <script src="js/components/habitTracker.js"></script>
  <script src="js/components/sidePanel.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
